name: Python tests

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

jobs:
  tests_maturin:

    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Run Tests in Maturin Container
        uses: docker://ghcr.io/pyo3/maturin:latest
        with:
          args: >
            sh -c "
            cargo test --verbose &&
            pip install pylint &&
            python3 -m pylint --rcfile pylint.toml . &&
            maturin develop --release -- -C target-cpu=native &&
            python3 -m unittest discover -s tests
            "

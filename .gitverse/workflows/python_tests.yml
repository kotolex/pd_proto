name: Python tests

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

jobs:
  tests_python_310:

    runs-on: ubuntu-cloud-runner

    steps:
      - uses: actions/checkout@v3
      - name: Set up Python 3.10
        uses: actions/setup-python@v3
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pylint
      - name: Lint
        run: |
          python -m pylint --rcfile pylint.toml .
      - name: Maturin
        run: |
          pip install maturin
          maturin develop --release -- -C target-cpu=native
      - name: Unit-tests
        run: |
          python -m unittest discover -s tests
[package]
name = "pd_proto"
version = "0.4.2"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "pd_proto"
crate-type = ["cdylib"]

[dependencies]
flate2 = { version = "1.1.10", features = ["zlib-ng"] }
pyo3 = { version = "0.29.2", features = ["extension-module"] }
mimalloc = "0.1.52"

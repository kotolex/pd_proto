[build-system]
requires = ["maturin>=1.9.4,<2"]
build-backend = "maturin"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[project]
name = "pd_proto"
version = "1.1.1"
description = "Binary protocol specializes exclusively in the ultra-fast serialization and deserialization of Python's built-in types"
readme = "README.md"
authors = [{ name = "kotolex", email = "farofwell@gmail.com" }]
license = "AGPL-3.0-only OR LicenseRef-Proprietary"
license-files = ["LICENSE"]
classifiers = [
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Education",
    "Topic :: Software Development",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Development Status :: 5 - Production/Stable",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
keywords = ["binary", "dump", "protocol", "pd_proto", "PeaceData", "PDProto", "pickle", "serialization", "proto", "buffer", "adler32", "explain"]
dependencies = []
requires-python = ">=3.8"

[project.urls]
Homepage = "https://github.com/kotolex/pd_proto"

